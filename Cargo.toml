[package]
name = "sevra"
version = "0.2.33"
edition = "2021"
# MSRV: enforced by the ci `msrv` job against the LOCKED tree. 1.88 is the
# tree's true floor (home 0.5.12 requires it; base64ct needs edition2024/1.85).
# Bump only with a recorded reason.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/sevrahq/sevra"
homepage = "https://www.sevrahq.com"
description = "The command line for the Sevra hub — the managed home for db.md brains. Signed, self-updating, zero-runtime static binary."
authors = ["VibeCraft Inc"]
readme = "README.md"

[[bin]]
name = "sevra"
path = "src/main.rs"

[dependencies]
# CLI parsing — derive, no_std-free, the clap the whole ecosystem uses.
clap = { version = "4", features = ["derive"] }
# HTTP with rustls (no OpenSSL, no system TLS) — a static binary that runs on
# any distro. `json` pulls serde_json wiring; we parse manually for the
# non-JSON-refusal contract, so only `tls` + `gzip` matter operationally.
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
# Parse the complete URL authority before applying the HTTPS/loopback policy.
# A string-prefix check is vulnerable to `localhost@remote-host` userinfo tricks.
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ed25519 signature verification for the self-update path (the pinned publisher
# key). Pure-Rust, audited, no C.
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
crc32fast = "1.5"
# OS randomness for the browser sign-in's PKCE verifier (a credential, so it
# must not come from a userspace PRNG). Already in the tree via rustls.
getrandom = "0.2"
zip = { version = "7.2", default-features = false, features = ["deflate"] }
# Home directory resolution for ~/.sevra (no libc dance).
home = "0.5"
# No-echo terminal read for `secrets set` (a secret value must never echo).
# Prompts + reads /dev/tty directly, so --json stdout stays clean. The
# ecosystem standard; tiny (rtoolbox + the already-present libc family).
rpassword = "7"
# The push secret-scan preflight: one compiled RegexSet over the fixed
# credential patterns, with boundary validation for each candidate. The
# ecosystem standard; adds
# aho-corasick + regex-automata/-syntax (memchr was already in the tree).
regex = "1"
# `.sevralocal` (the store's local scope) entries are paths or globs; globset
# compiles the whole list into one matcher. BurntSushi, same family as regex
# (shares aho-corasick/regex-automata/-syntax; adds bstr). log feature off.
globset = { version = "0.4", default-features = false }
# Export names are checked against one cross-platform filesystem model. Unicode
# canonical aliases must collapse before case comparison or macOS can silently
# install two hosted paths onto one inode.
unicode-normalization = "0.1"
# RFC3339 timestamps in signed brain-package snapshot records. Formatting only;
# no locale or timezone database enters the binary.
time = { version = "0.3", default-features = false, features = ["formatting"] }
[target.'cfg(unix)'.dependencies]
# Capability-style traversal for local scope and asset paths: checking
# symlink_metadata and then opening has a race, so the kernel enforces each
# component with openat(O_NOFOLLOW) and installs via renameat.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Hold directory handles without FILE_SHARE_DELETE, reject reparse-point
# components, and atomically install verified bytes with MoveFileExW.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
