# Post-manifest install smoke: run the REAL installer against a release after
# its independently reviewed digests are live on www.sevrahq.com. The origin
# manifest deliberately cannot be updated by this repository's release job;
# auto-running at release publication would only prove that fail-closed trust
# rejects a not-yet-approved version.
name: post-manifest smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Approved version to smoke (without leading v)"
        required: true

permissions:
  contents: read

jobs:
  rotation-bridge:
    name: signer bridge routing
    runs-on: ubuntu-24.04
    steps:
      - name: Keep legacy clients on the old-signed bridge
        shell: bash
        env:
          SEVRA_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${SEVRA_VERSION#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          endpoint="https://www.sevrahq.com/api/hub/versions?smoke=${GITHUB_RUN_ID}"
          read_latest() {
            curl -fsSL \
              -H 'Cache-Control: no-cache, no-store' \
              -A "$1" \
              "$endpoint" |
              node -e '
                let body = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => body += chunk);
                process.stdin.on("end", () => {
                  const latest = JSON.parse(body)?.sevra?.latest;
                  if (typeof latest !== "string") {
                    throw new Error("versions response has no sevra.latest");
                  }
                  process.stdout.write(latest);
                });
              '
          }
          legacy_latest="$(read_latest 'sevra/0.2.7')"
          bridge_client_latest="$(read_latest 'sevra/0.2.9')"
          legacy_expected="$(
            node -e '
              const current = process.argv[1].split("-", 1)[0].split(".").map(Number);
              const bridge = [0, 2, 8];
              const firstDifference = current.findIndex(
                (part, index) => part !== bridge[index]
              );
              const newer = firstDifference !== -1 &&
                current[firstDifference] > bridge[firstDifference];
              process.stdout.write(newer ? "0.2.9" : process.argv[1]);
            ' "$version"
          )"
          [ "$legacy_latest" = "$legacy_expected" ] || {
            echo "legacy sevra/0.2.7 was offered $legacy_latest, expected $legacy_expected" >&2
            exit 1
          }
          [ "$bridge_client_latest" = "$version" ] || {
            echo "sevra/0.2.9 was offered $bridge_client_latest, expected $version" >&2
            exit 1
          }

  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Run the installer against the release
        shell: bash
        env:
          SEVRA_VERSION: ${{ inputs.version }}
          SEVRA_REQUIRE_SIGNATURE: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Strip a leading v and reject anything but a concrete SemVer.
          export SEVRA_VERSION="${SEVRA_VERSION#v}"
          echo "$SEVRA_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          curl -fsSL https://www.sevrahq.com/install/sevra.sh -o "$RUNNER_TEMP/production-sevra.sh"
          cmp install.sh "$RUNNER_TEMP/production-sevra.sh"
          export SEVRA_INSTALL_DIR="$RUNNER_TEMP/sevra-bin"
          sh install.sh
          "$SEVRA_INSTALL_DIR/sevra" version
          "$SEVRA_INSTALL_DIR/sevra" version --json | grep '"version"'
          "$SEVRA_INSTALL_DIR/sevra" version | grep -F "$SEVRA_VERSION"
          # The not-logged-in path is the offline contract check.
          if "$SEVRA_INSTALL_DIR/sevra" brains 2>err.txt; then
            echo "expected failure without a key" >&2; exit 1
          fi
          grep -q "not logged in" err.txt

  install-windows:
    name: install (windows-2025)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Run the PowerShell installer against the release
        shell: pwsh
        env:
          SEVRA_VERSION: ${{ inputs.version }}
          SEVRA_REQUIRE_SIGNATURE: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = "$env:SEVRA_VERSION" -replace '^v', ''
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') { throw 'version must be concrete SemVer' }
          $env:SEVRA_VERSION = $v
          $prodInstaller = Join-Path $env:RUNNER_TEMP 'production-sevra.ps1'
          Invoke-WebRequest -Uri 'https://www.sevrahq.com/install/sevra.ps1' -OutFile $prodInstaller -UseBasicParsing
          # A Windows checkout may materialize CRLF even though the canonical
          # Git blob and the production route are LF. Compare the downloaded
          # bytes to the immutable blob, not to Git's checkout conversion.
          $canonicalInstaller = (git rev-parse 'HEAD:install.ps1').Trim()
          $productionInstaller = (git hash-object --no-filters $prodInstaller).Trim()
          if ($canonicalInstaller -ne $productionInstaller) {
            throw 'production sevra.ps1 is not byte-identical to the canonical installer'
          }
          $env:SEVRA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'sevra-bin'
          ./install.ps1
          $bin = Join-Path $env:SEVRA_INSTALL_DIR 'sevra.exe'
          & $bin version
          if ($LASTEXITCODE -ne 0) { throw 'version failed' }
          $json = (& $bin version --json | Out-String)
          if ($json -notmatch '"version"') { throw 'version --json missing "version"' }
          $out = (& $bin version | Out-String)
          if ($out -notmatch [regex]::Escape($env:SEVRA_VERSION)) { throw "expected pinned $env:SEVRA_VERSION" }
          # The not-logged-in path is the offline contract check.
          # Start-Process returns the expected non-zero status as data. Calling
          # the binary directly lets the Actions pwsh wrapper terminate before
          # the assertion can inspect $LASTEXITCODE.
          $proc = Start-Process -FilePath $bin -ArgumentList @('brains') -NoNewWindow -Wait -PassThru -RedirectStandardError err.txt
          if ($proc.ExitCode -eq 0) { throw 'expected failure without a key' }
          if ((Get-Content err.txt -Raw) -notmatch 'not logged in') { throw 'missing not-logged-in message' }
